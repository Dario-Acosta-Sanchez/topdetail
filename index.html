<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }

<title>Top Detail Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: un teléfono a pantalla completa; la foto ocupa todo, los servicios cuelgan de los dos bordes y la ficha va abajo, sobre el suelo. */
:root {
  --void: #060708;          /* fuera del teléfono */
  --ink: #f4f1ee;           /* texto principal */
  --mute: #b4aaa7;          /* texto secundario, gris tirando a rojo */
  --red: #e8192c;           /* rojo de marca */
  --glass: rgba(0, 0, 0, .8);
  --line: rgba(255, 255, 255, .12);
  --ui: 'Rajdhani', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--void); color: var(--ink); font-family: var(--ui);
  overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; display: grid; place-items: center; }
.phone {
  position: relative; height: 100%; width: min(100%, 480px, calc(100dvh * .5));
  overflow: hidden; background: #000; touch-action: none; user-select: none; container-type: size;
}

/* Fotos a todo el ancho sobre negro (sin recortar los lados), algo por encima del centro,
   y fundidas por abajo con el negro de la página */
.layer, .seq {
  --img-h: calc(100cqw * 1.7917);
  position: absolute; left: 0; width: 100%; height: var(--img-h);
  top: max(0px, calc((100cqh - var(--img-h)) * .3));
  -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
}
.layer { object-fit: cover; object-position: 50% 50%; display: block; max-width: none; }
#front { opacity: 0; will-change: opacity, transform, clip-path; }
/* Acercamiento en vídeo: fotogramas pintados en un canvas encima de las fotos */
.seq { opacity: 0; pointer-events: none; }
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.55) 0, rgba(0,0,0,0) 16%),
    linear-gradient(to top, rgba(4,3,3,.94) 0, rgba(4,3,3,.72) 20%, rgba(4,3,3,0) 38%);
}
.sweep {
  position: absolute; top: 0; bottom: 0; left: 0; width: 3px; opacity: 0; pointer-events: none;
  background: var(--red);
  box-shadow: 0 0 14px 3px rgba(232, 25, 44, .75), 0 0 2px 1px #fff;
}

/* Cabecera */
.top {
  position: absolute; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.logo { background: none; border: 0; padding: 0; cursor: pointer; display: block; }
.logo img { height: 38px; width: auto; display: block; mix-blend-mode: screen; }
.cita {
  font: 700 13px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; text-decoration: none;
  color: var(--ink); background: var(--red); padding: 10px 14px; border-radius: 2px;
  box-shadow: 0 4px 18px rgba(232, 25, 44, .35); transition: opacity .5s;
}

/* Servicios en los laterales: pestañas que salen de cada borde */
.side { position: absolute; top: 25%; z-index: 3; display: grid; gap: 10px; }
.side.l { left: 0; padding-left: env(safe-area-inset-left, 0px); }
.side.r { right: 0; padding-right: env(safe-area-inset-right, 0px); }
.side button {
  width: 74px; height: 74px; display: grid; place-content: center; justify-items: center; gap: 6px;
  font: 700 11px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); cursor: pointer; position: relative;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transition: background .25s, border-color .25s, transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s;
}
.side.l button { border-left: 0; border-radius: 0 6px 6px 0; box-shadow: inset 3px 0 0 var(--red); }
.side.r button { border-right: 0; border-radius: 6px 0 0 6px; box-shadow: inset -3px 0 0 var(--red); }
.side svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.side button[aria-current="true"] { background: var(--red); border-color: var(--red); }
.side button:active { transform: scale(.94); }
/* Llamada de atención en el inicio, hasta el primer toque */
.invite .side button::after {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
  border: 1px solid var(--red); opacity: 0; animation: ping 2.4s ease-out infinite;
}
.invite .side button:nth-child(2)::after { animation-delay: .3s; }
.invite .side.r button::after { animation-delay: .6s; }
.invite .side.r button:nth-child(2)::after { animation-delay: .9s; }
@keyframes ping { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.18); } }

/* Ficha inferior */
.hud {
  position: absolute; inset: auto 0 0; z-index: 3; display: grid; gap: 4px;
  padding-block: 0 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .5s;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.eyebrow {
  margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--mute);
  display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;
}
.eyebrow::before { content: ""; width: 8px; height: 8px; background: var(--red); flex: none; transform: rotate(45deg); }
.count { font-size: 13px; font-weight: 600; color: var(--mute); font-variant-numeric: tabular-nums; letter-spacing: .08em; }
h1 {
  margin: 0; font-size: 34px; line-height: 1; font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
  text-wrap: balance; display: flex; align-items: center; gap: 0 10px; flex-wrap: wrap;
}
/* Palabras clave en rojo, como en la imagen corporativa */
.desc .k { font-weight: 700; text-shadow: none; }
.k { color: var(--red); text-shadow: 0 0 18px rgba(232, 25, 44, .35); }
.tag { font-size: 12px; letter-spacing: .16em; padding: 4px 7px 3px; border: 1px solid var(--line); color: var(--mute); border-radius: 2px; }
.tag.on { border-color: var(--red); color: var(--ink); background: rgba(232,25,44,.22); }
.desc { margin: 2px 0 0; font-size: 16px; line-height: 1.3; font-weight: 500; color: #cbc4c1; max-width: 34ch; min-height: 2.6em; }
/* Antes / Después: aparece cuando termina el paso automático */
.ab { display: flex; gap: 6px; margin-top: 10px; transition: opacity .35s; }
.ab.wait { opacity: 0; pointer-events: none; }
.ab button {
  flex: 1; height: 44px; font: 700 13px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; transition: background .25s, border-color .25s;
}
.ab button[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.ab button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* Comparador de la cera: panel de cristal líquido con barra deslizante */
.glass {
  position: relative; margin-top: 12px; padding: 12px 16px 14px; border-radius: 22px; display: grid; gap: 8px;
  background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 45%, rgba(255,255,255,.09));
  border: 1px solid rgba(255,255,255,.28);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -10px 24px rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.45);
  -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
  transition: opacity .35s;
}
.glass::before {
  content: ""; position: absolute; inset: 1px 18% auto; height: 40%; border-radius: 20px 20px 50% 50%; pointer-events: none;
  background: linear-gradient(to bottom, rgba(255,255,255,.22), rgba(255,255,255,0));
}
.glass.wait { opacity: 0; pointer-events: none; }
.glass-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.glass-row em { font-style: normal; font-weight: 600; letter-spacing: .04em; text-transform: none; font-size: 13px; color: var(--mute); }
#cmp { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; margin: 0; background: none; cursor: grab; touch-action: none; }
#cmp::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--red) var(--v, 100%), rgba(255,255,255,.22) var(--v, 100%)); }
#cmp::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); }
#cmp::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--red); }
#cmp::-webkit-slider-thumb {
  -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,255,255,.55) 45%, rgba(255,255,255,.25));
  border: 2px solid var(--red); box-shadow: 0 2px 10px rgba(0,0,0,.5), 0 0 0 4px rgba(232,25,44,.25);
}
#cmp::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.8);
  border: 2px solid var(--red); box-shadow: 0 2px 10px rgba(0,0,0,.5), 0 0 0 4px rgba(232,25,44,.25);
}
#cmp:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 4px; }

/* Dentro de una sección solo queda «Volver», arriba a la izquierda */
.back {
  position: absolute; top: 11%; left: 0; z-index: 3; height: 52px; display: flex; align-items: center; gap: 6px;
  padding: 0 16px 0 calc(10px + env(safe-area-inset-left, 0px));
  font: 700 13px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); border-left: 0; border-radius: 0 6px 6px 0;
  box-shadow: inset 3px 0 0 var(--red); cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transform: translateX(-110%); transition: transform .55s cubic-bezier(.2,.8,.2,1) .12s;
}
.back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.in-cat .back { transform: none; }
.back:active { transform: scale(.95); }

/* Opciones de cada sección en pestañas a los lados (en Extras: interior a la izquierda, exterior a la derecha) */
.xside {
  position: absolute; top: calc(11% + 64px); z-index: 3; display: grid; gap: 5px;
  transition: transform .55s cubic-bezier(.2,.8,.2,1) .1s;
}
.xside.l { left: 0; padding-left: env(safe-area-inset-left, 0px); transform: translateX(-110%); }
.xside.r { right: 0; padding-right: env(safe-area-inset-right, 0px); transform: translateX(110%); justify-items: end; }
.in-cat .xside { transform: none; }
.xside.r p { text-align: right; justify-self: stretch; }
.xside p {
  margin: 0 0 1px; font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--ink);
  padding: 0 8px; text-shadow: 0 1px 5px rgba(0,0,0,.9);
}
.xside button {
  width: 74px; min-height: 40px; padding: 5px 6px; display: flex; align-items: center;
  font: 700 10px/1.1 var(--ui); letter-spacing: .02em; text-transform: uppercase; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: background .25s, border-color .25s;
}
.xside.l button { border-left: 0; border-radius: 0 5px 5px 0; box-shadow: inset 2px 0 0 var(--red); text-align: left; }
.xside.r button { border-right: 0; border-radius: 5px 0 0 5px; box-shadow: inset -2px 0 0 var(--red); text-align: right; justify-content: flex-end; }
.xside button[aria-current="true"] { background: var(--red); border-color: var(--red); }
.xside button:active { transform: scale(.95); }

.side button:focus-visible, .cita:focus-visible, .logo:focus-visible, .back:focus-visible, .xside button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (max-height: 700px) { .xside button { min-height: 34px; } .xside { gap: 4px; } }

/* Pantalla de carga: el sucio pasa a limpio mientras se descargan las fotos */
.loader {
  position: absolute; inset: auto 0 0; z-index: 4; display: grid; gap: 10px; transition: opacity .6s;
  padding-block: 0 26px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.loader p { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.loader b { font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.loader #pct { font-size: 15px; font-weight: 600; color: var(--mute); font-variant-numeric: tabular-nums; letter-spacing: .08em; }
.bar { height: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--red); transform-origin: 0 50%; transform: scaleX(0); }
.loading .hud, .loading .cita { opacity: 0; pointer-events: none; }
.loading .side.l button, .in-cat .side.l button { transform: translateX(-110%); }
.loading .side.r button, .in-cat .side.r button { transform: translateX(110%); }
.side button:nth-child(2) { transition-delay: 0s, 0s, .08s, 0s; }
.loader.done { opacity: 0; pointer-events: none; }

@media (max-width: 350px) { .side button { width: 64px; height: 64px; } h1 { font-size: 30px; } }
@media (prefers-reduced-motion: reduce) {
  .invite .side button::after { animation: none; }
  .side button, .back, .xside, .xside button, .hud, .loader, .cita, .ab, .ab button, .glass { transition: none; }
}
</style>
</head>
<body>

<div class="app">
  <div class="phone loading invite" id="phone">
    <img class="layer" id="back" alt="Audi A7 rojo sucio en el taller de Top Detail Garage">

    <header class="top">

    </section>

    <nav class="xside l" id="opt-l" aria-label="Opciones" inert></nav>
    <nav class="xside r" id="opt-r" aria-label="Opciones" inert></nav>

    <div class="loader" id="loader" role="status">
      <p><b>Bienvenido a <span class="k">Top Detail</span></b><span id="pct">0 %</span></p>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>
</div>

    ['interior', 'cuero', 'Limpieza de cuero', 'Cuero', 'Sin grasa ni brillos sucios: el cuero vuelve a su *tacto mate*.'],
    ['interior', 'coating-cuero', 'Coating de cuero', 'Coating cuero', 'Una protección que impide que los líquidos *penetren y manchen*.'],
    ['interior', 'cinturones', 'Cinturones', 'Cinturones', 'Cintas limpias y con su *color original*.'],
    ['interior', 'plasticos', 'Plásticos interiores', 'Plásticos', 'Salpicadero y puertas sin polvo ni huellas, en *negro satinado*.'],
    ['interior', 'negro-piano', 'Negro piano', 'Negro piano', 'Pulimos los *micro-arañazos* y las huellas de la consola.'],
    ['cristales', 'pulido-cristales', 'Pulido de cristales', 'Cristales', 'Fuera la *cal*, los arcos del limpia y la *grasa*.'],
    ['motor', 'vano-motor', 'Vano motor', 'Motor', 'Limpieza y protección del motor, *sin riesgos*.'],
    ['ruedas', 'neumaticos', 'Neumáticos', 'Neumáticos', 'Del marrón apagado a un *negro satinado*.'],
    ['ruedas', 'pasos-de-rueda', 'Pasos de rueda', 'Pasos de rueda', 'Barro incrustado fuera, *pasos limpios*.'],
    ['carroceria', 'hidratacion-gomas', 'Hidratación de gomas', 'Gomas', 'Juntas resecas que vuelven a estar *negras y flexibles*.'],
    ['carroceria', 'plateados', 'Plateados', 'Plateados', 'Molduras sin oxidación ni cal, con *brillo de espejo*.'],
    ['carroceria', 'cera-rapida', 'Cera rápida', 'Cera', 'Brillo húmedo y *reflejos nítidos* en minutos.', { slider: true }],
  ].forEach(([z, n, name, short, desc, more = {}]) => CATS.extras.opts.push(
    o(name, short, desc, `05-extras_${z}_${n}_antes`, `05-extras_${z}_${n}_despues`, n, { zone: ZONA[z], group: z === 'interior' ? 0 : 1, ...more })));

  const $ = id => document.getElementById(id);
  const back = $('back'), front = $('front'), sweep = $('sweep'), phone = $('phone');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  let cat = null, opt = -1, state = 'b', abReady = false, loading = true;
  let token = 0, shownSrc = SUCIO, shownFrame = 'car', chain = Promise.resolve(), pending = 0;
  // Cola de animaciones: todo cambio de imagen va en orden; pending > 0 mientras algo se mueve
  const q = fn => { pending++; chain = chain.then(fn).catch(() => {}).finally(() => pending--); return chain; };

  // ── Cambio de foto (en cola; si llega otra orden, las viejas se saltan) ──
  async function doShow(src, frame, dir, my) {
    if (my !== token || src === shownSrc) return;
    if (!reduce) {
      front.src = img(src);
      try { await front.decode(); } catch (e) {}
      let anims;
      if (frame === shownFrame) {
        // Barrido: la nueva foto entra detrás de una línea roja, como una pasada de máquina
        const from = dir > 0 ? 'inset(0 100% 0 0)' : 'inset(0 0 0 100%)';
        const w = phone.clientWidth;
        const opt = { duration: 950, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' };
        anims = [
          front.animate([{ opacity: 1, clipPath: from }, { opacity: 1, clipPath: 'inset(0 0 0 0)' }], opt),
          sweep.animate([{ opacity: 1, transform: `translateX(${dir > 0 ? 0 : w}px)` }, { opacity: 1, transform: `translateX(${dir > 0 ? w : 0}px)` }], opt),
        ];
      } else {
        const opt = { duration: 720, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'forwards' };
        anims = [
          front.animate([{ opacity: 0, transform: 'scale(1.07)' }, { opacity: 1, transform: 'scale(1)' }], opt),
          back.animate([{ transform: 'scale(1)' }, { transform: 'scale(.97)' }], opt),
        ];
      }
      await Promise.all(anims.map(a => a.finished));
      back.src = img(src);
      try { await back.decode(); } catch (e) {}
      anims.forEach(a => a.cancel());
    } else {
      back.src = img(src);
    }
    shownSrc = src; shownFrame = frame;
  }
  const show = (src, frame, dir, my) => q(() => doShow(src, frame, dir, my));

  // ── Acercamiento en vídeo (Veo): del coche entero al macro de la pintura ──
  const VN = 120, frames = [], SWIRLS = '03-correccion_pintura_swirls';
  const seq = $('seq'), sctx = seq.getContext('2d');
  let lastDrawn = -1, scrubP = null, drag = null;
  function sizeSeq() {
    const d = Math.min(devicePixelRatio || 1, 2);
    seq.width = Math.round(phone.clientWidth * d); seq.height = Math.round(seq.offsetHeight * d); lastDrawn = -1;
  }
  function drawP(p) {
    const i = Math.round(Math.max(0, Math.min(1, p)) * (VN - 1));
    const im = frames[i];
    if (i === lastDrawn || !im || !im.complete || !im.naturalWidth) return;
    const cw = seq.width, ch = seq.height, k = Math.max(cw / im.naturalWidth, ch / im.naturalHeight);
    const w = im.naturalWidth * k, h = im.naturalHeight * k;
    sctx.drawImage(im, (cw - w) / 2, (ch - h) / 2, w, h); lastDrawn = i;
  }
  const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  function tween(a, b, ms, fn, e = easeIO) {
    return new Promise(res => {
      if (reduce || ms <= 0) { fn(b); return res(); }
      const t0 = performance.now();
      const f = now => { const k = Math.min(1, (now - t0) / ms); fn(a + (b - a) * e(k)); k < 1 ? requestAnimationFrame(f) : res(); };
      requestAnimationFrame(f);
    });
  }
  const fade = (to, ms) => tween(+getComputedStyle(seq).opacity, to, ms, v => seq.style.opacity = v, t => t);
  // Recorre el vídeo de from a to (0 = coche entero, 1 = macro) y deja debajo la foto que toca
  async function bridge(from, to) {
    sizeSeq(); drawP(from);
    await fade(1, 260);
    await tween(from, to, 3200 * Math.abs(to - from) + 150, drawP);
    const src = to === 1 ? SWIRLS : LIMPIO;
    back.src = img(src); try { await back.decode(); } catch (e) {}
    shownSrc = src; shownFrame = to === 1 ? 'macro' : 'car';
    await fade(0, 380);
  }
  // Scroll magnético: en el inicio, deslizar hacia arriba acerca la cámara; en pintura, hacia abajo la aleja.
  // Al soltar, si has pasado el umbral termina sola; si no, vuelve a su sitio.
  function scrubStart(dir) {
    if (loading || pending || sliding) return false;
    if (dir > 0 && cat !== null) return false;
    if (dir < 0 && !(cat === 'pintura' && shownFrame === 'macro')) return false;
    sizeSeq(); drag = { dir, p: dir > 0 ? 0 : 1 };
    return true;
  }
  function scrubMove(p) {
    drag.p = Math.max(0, Math.min(1, p)); drawP(drag.p);
    seq.style.opacity = Math.min(1, (drag.dir > 0 ? drag.p : 1 - drag.p) * 10);
  }
  function scrubEnd() {
    const d = drag; drag = null;
    if (!d) return;
    if (d.dir > 0 && d.p > .25) { scrubP = d.p; play('pintura', 0); }
    else if (d.dir < 0 && d.p < .75) { scrubP = d.p; home(); }
    else q(async () => { await tween(d.p, d.dir > 0 ? 0 : 1, 320, drawP); await fade(0, 200); });
  }

  // ── Comparador (cera): el después encima, recortado por la barra; el antes debajo ──
  let sliding = false;
  const cmp = $('cmp');
  function setCmp(v) {
    cmp.value = v; cmp.style.setProperty('--v', v + '%');
    front.style.clipPath = `inset(0 ${100 - v}% 0 0)`;
    sweep.style.transform = `translateX(${v / 100 * phone.clientWidth - 1}px)`;
  }
  async function enterSlider(O, my) {
    if (my !== token) return;
    front.src = img(O.b);
    try { await front.decode(); } catch (e) {}
    front.style.opacity = 1; front.style.clipPath = 'inset(0 0 0 0)';
    back.src = img(O.a);
    try { await back.decode(); } catch (e) {}
    if (my !== token) return;
    sliding = true; sweep.style.opacity = 1; setCmp(100);
    if (reduce) return setCmp(50);
    // Pequeña demostración: la barra baja sola hasta la mitad para enseñar que se puede mover
    const t0 = performance.now();
    await new Promise(res => {
      const f = now => {
        if (!sliding || my !== token) return res();
        const k = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - k, 3);
        setCmp(100 - 50 * e);
        k < 1 ? requestAnimationFrame(f) : res();
      };
      requestAnimationFrame(f);
    });
  }
  async function exitSlider() {
    if (!sliding) return;
    sliding = false;
    back.src = img(shownSrc);
    try { await back.decode(); } catch (e) {}
    front.style.cssText = ''; sweep.style.cssText = '';
  }
  cmp.addEventListener('input', () => { if (sliding) setCmp(+cmp.value); });

  // ── Pantalla ──
  function buildOpts() {
    const C = CATS[cat], heads = C.groups || [null, C.head];
    [$('opt-l'), $('opt-r')].forEach((nav, g) => {
      nav.innerHTML = '';
      const items = C.opts.map((x, i) => [x, i]).filter(([x]) => (x.group ?? 1) === g);
      nav.hidden = !items.length;
      if (!items.length) return;
      const p = document.createElement('p'); p.textContent = heads[g]; nav.append(p);
      items.forEach(([x, i]) => {
        const b = document.createElement('button');
        b.textContent = x.short; b.dataset.i = i; b.setAttribute('aria-label', x.name);
        b.onclick = () => play(cat, i);
        nav.append(b);
      });
    });
  }

  function chrome() {
    const inCat = cat !== null;
    phone.classList.toggle('in-cat', inCat);
    document.querySelectorAll('.side').forEach(n => n.inert = inCat);
    $('back-btn').inert = $('opt-l').inert = $('opt-r').inert = !inCat;
    if (inCat) phone.classList.remove('invite');
    document.querySelectorAll('.xside button').forEach(b => b.setAttribute('aria-current', String(+b.dataset.i === opt)));
  }

  function paintAB() {
    const O = cat && CATS[cat].opts[opt];
    $('ab').hidden = !O || !!O.slider;
    $('glass').hidden = !O || !O.slider;
    if (!O) return;
    $('ab').classList.toggle('wait', !abReady);
    $('glass').classList.toggle('wait', !abReady);
    $('ab-a').textContent = O.la || 'Antes';
    $('ab-b').textContent = O.lb || 'Después';
    $('ab-a').setAttribute('aria-pressed', String(state === 'a'));
    $('ab-b').setAttribute('aria-pressed', String(state === 'b'));
    $('ab-a').disabled = $('ab-b').disabled = !abReady;
    const t = $('name').querySelector('.tag');
    if (t) { t.textContent = state === 'a' ? (O.la || 'Antes') : (O.lb || 'Después'); t.classList.toggle('on', state === 'b'); }
  }

  // Título: texto en blanco y las palabras clave en rojo
  const PREF = { limpieza: 'Limpieza', tintado: 'Tintado' };
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const rich = t => esc(t).replace(/\*(.+?)\*/g, '<strong class="k">$1</strong>');
  const plain = t => t.replace(/\*/g, '');
  function titleHTML(C, O) {
    if (!O) return 'Así sale de <span class="k">Top Detail</span>';
    const p = PREF[cat];
    if (p) return `${p} <span class="k">${esc(O.name)}</span>`;
    const w = O.name.split(' ');
    return w.length > 1 ? `${esc(w[0])} <span class="k">${esc(w.slice(1).join(' '))}</span>` : `<span class="k">${esc(O.name)}</span>`;
  }

  function paintInfo() {
    const C = cat && CATS[cat], O = C && C.opts[opt];
    $('eyebrow').textContent = !C ? 'Top Detail Garage · Fernán Núñez' : O.zone ? `${C.label} · ${O.zone}` : C.label;
    $('count').textContent = C ? `${String(opt + 1).padStart(2, '0')} / ${String(C.opts.length).padStart(2, '0')}` : '';
    $('name').innerHTML = titleHTML(C, O);
    if (O) { const t = document.createElement('span'); t.className = 'tag'; $('name').append(t); }
    $('desc').innerHTML = rich(O ? O.desc : 'Elige un *servicio* a los lados o desliza hacia arriba para ver la *pintura* de cerca.');
    const what = !C ? 'vuestros servicios' : `${C.label.split(' ·')[0]} (${O.name})`;
    $('cita').href = W + encodeURIComponent(`Hola! Me interesa ${what}. ¿Me dais información?`);
    back.alt = O ? `${O.name}. ${plain(O.desc)}` : 'Audi A7 rojo limpio en el taller de Top Detail Garage';
    paintAB();
    if (!reduce && !loading) $('hud').animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.7,.2,1)' });
  }

  // Al tocar una opción: se ve el antes, a 1 s pasa solo al después y aparece el botón Antes / Después
  async function play(c, i) {
    if (loading) return;
    const my = ++token;
    const prevI = c === cat ? opt : -1, prev = prevI >= 0 ? CATS[c].opts[prevI] : null, wasHome = cat === null;
    if (c !== cat) { cat = c; buildOpts(); }
    const O = CATS[c].opts[i];
    // Secciones evolutivas (limpieza, tintado, pintura): si ya estás en esa escena,
    // pasa directamente del nivel que ves al nuevo, sin volver al estado inicial
    const direct = !!(CATS[c].evo && prev && i !== prevI && prev.frame === O.frame);
    opt = i; state = direct ? 'b' : 'a'; abReady = false;
    chrome(); paintInfo();
    q(exitSlider);
    if (c === 'pintura' && wasHome) { const p0 = scrubP ?? 0; scrubP = null; q(() => bridge(p0, 1)); }
    if (direct) {
      await show(O.b, O.frame, i > prevI ? 1 : -1, my); if (my !== token) return;
      abReady = true; paintAB();
      return;
    }
    await show(O.a, O.frame, 1, my); if (my !== token) return;
    await wait(HOLD); if (my !== token) return;
    state = 'b'; paintAB();
    await show(O.b, O.frame, 1, my); if (my !== token) return;
    abReady = true; paintAB();
    if (O.slider) q(() => enterSlider(O, my));
  }
  function flip(s) {
    if (!abReady || s === state) return;
    const my = ++token, O = CATS[cat].opts[opt];
    state = s; paintAB();
    show(s === 'a' ? O.a : O.b, O.frame, s === 'a' ? -1 : 1, my);
  }
  function home() {
    if (loading || cat === null) return;
    const my = ++token;
    const wasPintura = cat === 'pintura', p0 = scrubP ?? 1; scrubP = null;
    cat = null; opt = -1; abReady = false;
    chrome(); paintInfo();
    q(exitSlider);
    // Desde los macros de pintura, la cámara se aleja con el vídeo al revés
    q(() => wasPintura && shownFrame === 'macro' ? bridge(p0, 0) : doShow(LIMPIO, 'car', -1, my));
  }

  document.querySelectorAll('.side button').forEach(b => b.onclick = () => play(b.dataset.cat, 0));
  $('back-btn').onclick = home;
  $('logo').onclick = home;
  $('ab-a').onclick = () => flip('a');
  $('ab-b').onclick = () => flip('b');
  addEventListener('keydown', e => { if (e.key === 'Escape') home(); });
  // Solo se navega con los botones: sin scroll ni gestos
  let sy = 0, wheelT;
  phone.addEventListener('touchstart', e => { sy = e.touches[0].clientY; }, { passive: true });
  phone.addEventListener('touchmove', e => {
    if (e.target === cmp) return;
    e.preventDefault();
    const dy = sy - e.touches[0].clientY;   // > 0 al subir el dedo
    if (!drag && Math.abs(dy) > 12) scrubStart(dy > 0 ? 1 : -1);
    if (drag) { const h = phone.clientHeight * .55; scrubMove(drag.dir > 0 ? dy / h : 1 + dy / h); }
  }, { passive: false });
  phone.addEventListener('touchend', scrubEnd);
  phone.addEventListener('touchcancel', scrubEnd);
  addEventListener('wheel', e => {
    e.preventDefault();
    if (!drag && (Math.abs(e.deltaY) < 2 || !scrubStart(e.deltaY > 0 ? 1 : -1))) return;
    scrubMove(drag.p + e.deltaY / 700);
    clearTimeout(wheelT); wheelT = setTimeout(scrubEnd, 180);
  }, { passive: false });

  // ── Pantalla de carga ──
  // Se descargan todas las fotos; el barrido de sucio a limpio avanza con la carga real
  // y dura como mínimo MIN ms, para que se vea aunque todo esté ya en caché.
  const MIN = reduce ? 0 : 2600;
  const all = [...new Set([SUCIO, LIMPIO, ...Object.values(CATS).flatMap(c => c.opts.flatMap(x => [x.a, x.b]))])];
  let loaded = 0;
  const t0 = performance.now();
  back.src = img(SUCIO);
  paintInfo();
  back.decode().catch(() => {}).then(() => {
    all.forEach(n => { const i = new Image(); i.onload = i.onerror = () => loaded++; i.src = img(n); });
    for (let k = 0; k < VN; k++) { const i = new Image(); i.onload = i.onerror = () => loaded++; i.src = `vid/p_${String(k).padStart(3, '0')}.webp`; frames[k] = i; }
    front.src = img(LIMPIO);
    front.decode().catch(() => {}).then(() => {
      front.style.opacity = 1; sweep.style.opacity = 1;
      let shown = 0;
      const tick = now => {
        const real = loaded / (all.length + VN);
        const time = MIN ? Math.min(1, (now - t0) / MIN) : 1;
        const target = Math.min(real, time);
        shown += (target - shown) * (reduce ? 1 : .09);
        if (target === 1 && shown > .996) shown = 1;
        const w = phone.clientWidth;
        front.style.clipPath = `inset(0 ${(1 - shown) * 100}% 0 0)`;
        sweep.style.transform = `translateX(${shown * w}px)`;
        $('bar').style.transform = `scaleX(${shown})`;
        $('pct').textContent = Math.round(shown * 100) + ' %';
        if (shown < 1) return requestAnimationFrame(tick);
        back.src = img(LIMPIO);
        back.decode().catch(() => {}).then(() => {
          front.style.cssText = ''; sweep.style.cssText = '';
          shownSrc = LIMPIO; shownFrame = 'car';
          $('loader').classList.add('done');
          phone.classList.remove('loading');
          loading = false;
          paintInfo();
        });
      };
      requestAnimationFrame(tick);
    });
  });
})();
</script>
